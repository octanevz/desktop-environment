# remap prefix to Control + Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# quick pane cycling
bind Tab select-pane -t :.+

# Claude Code
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse + copy mode
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
bind -n PageUp copy-mode -u

# History
set -g history-limit 50000

# Pane borders
set -g pane-border-indicators off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# tmux-better-mouse-mode
set -g @scroll-without-changing-pane 'on'
set -g @scroll-speed-num-lines-per-scroll '3'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# tmux-continuum: auto-restore last session on tmux start
set -g @continuum-restore 'on'

# tmux-resurrect: only restart these programs (skip long-running builds, dev servers, etc.)
set -g @resurrect-processes 'nvim lazygit lazydocker claude "~codex" "~opencode"'

# Fuzzy file picker → send path into active pane (relative if under cwd, else absolute)
bind C-f run-shell "tmux display-popup -E -w 80% -h 70% \
                                       -d '#{pane_current_path}' \
                                       -e 'TMUX_FILE_PICKER_TARGET=#{pane_id}' \
                                       ~/.local/bin/file-picker"

# tokyo-night-tmux (defaults are fine; uncomment to tweak)
# set -g @tokyo-night-tmux_window_id_style digital
# set -g @tokyo-night-tmux_pane_id_style hsquare
# set -g @tokyo-night-tmux_show_battery_widget 0
# set -g @tokyo-night-tmux_show_netspeed 0

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Overrides that must run AFTER plugins (tokyo-night-tmux hard-sets some of these)
set -g pane-border-status top
set -g pane-border-format '#[fg=#c0caf5] #{pane_index} #{pane_current_command} '
set -g pane-border-style        'fg=#565f89'
set -g pane-active-border-style 'fg=#565f89'
