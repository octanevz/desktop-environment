onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = false

[keys]
prefix           = "ctrl+space"
reload_config    = "prefix+r"
cycle_pane_next  = "prefix+tab"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical   = "prefix+shift+backslash"
split_horizontal = "prefix+minus"
copy_mode        = "prefix+["
zoom             = "prefix+z"

# Fuzzy file picker, the same binding tmux uses (prefix+C-f).
[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "~/.local/bin/file-picker"
description = "fuzzy file picker"
width = "80%"
height = "70%"
