# GNOME desktop settings, loaded by setup-06-configs.sh with "dconf load /".
# Each section is a dconf path; each line a key it holds, in the format
# "dconf dump /" produces, so a re-dump can be pasted in here. Only keys that
# are a choice belong here - window sizes, timestamps, "migrated" flags and
# the like are state the desktop rewrites on its own and are left out.
#
# Not here, because another script owns them:
# - favorite-apps (the dock): setup-06-configs.sh, DOCK_FAVORITES
# - enabled-extensions and the Caffeine and Tiling Shell settings:
#   setup-05-gnome-extensions.sh
# - the mutter edge-tiling and tiling keybindings: Tiling Shell clears those
#   itself when it starts and restores them when it is disabled
# - /system/locale region (Formats): setup-00-packages.sh

# Ptyxis, the terminal Ubuntu ships. The profile UUID is arbitrary; loading
# it makes this the one profile and the default.
[org/gnome/Ptyxis]
default-profile-uuid='84b23c36affdfff27337031f6aa15e10'
profile-uuids=['84b23c36affdfff27337031f6aa15e10']

[org/gnome/Ptyxis/Profiles/84b23c36affdfff27337031f6aa15e10]
bold-is-bright=true
label='Default'
palette='Horizon'

[org/gnome/TextEditor]
highlight-current-line=true
indent-style='space'
indent-width=4
show-line-numbers=true
show-map=true
show-right-margin=true
spellcheck=false
style-scheme='cobalt'
tab-width=uint32 4
wrap-text=false

[org/gnome/calculator]
button-mode='advanced'

# The wallpaper ships with Ubuntu 26.04 (package ubuntu-wallpapers).
[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/manuej-Vor.jpg'
picture-uri-dark='file:///usr/share/backgrounds/manuej-Vor.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/manuej-Vor.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/calendar]
show-weekdate=true
week-start-day='monday'

# What Ctrl+Alt+T opens. Upstream GNOME dropped that shortcut; Ubuntu patches
# it back into gnome-settings-daemon, and the patched code launches whatever
# this key names. Alacritty comes from setup-03-alacritty.sh; until that has
# run the shortcut opens nothing, and Ptyxis is still in the app grid.
[org/gnome/desktop/default-applications/terminal]
exec='alacritty'
exec-arg='-e'

# German keyboard without dead keys. The interface language and the formats
# locale are set by setup-00-packages.sh.
[org/gnome/desktop/input-sources]
sources=[('xkb', 'de+nodeadkeys')]

[org/gnome/desktop/interface]
accent-color='green'
clock-show-seconds=false
clock-show-weekday=true
color-scheme='prefer-dark'
gtk-theme='Yaru-olive-dark'
icon-theme='Yaru-olive-dark'

[org/gnome/desktop/notifications]
show-in-lock-screen=false

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/desktop/privacy]
remember-recent-files=false
report-technical-problems=false

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

# Never blank the screen; the machine also never suspends on AC power.
[org/gnome/desktop/session]
idle-delay=uint32 0

# Workspaces are switched with Ctrl+Super+Left/Right, as on Windows. The GNOME
# defaults are REPLACED, not extended: Ctrl+Alt+Left/Right is navigate
# back/forward in the JetBrains IDEs and would otherwise be swallowed by the
# shell, and Super+Alt and Super+Page_Up/Down go with it for a single set.
#
# Alt+Tab cycles through windows, as on Windows, rather than through
# applications with their windows grouped. The application switcher keeps
# Super+Tab, its other default, so it is still there.
[org/gnome/desktop/wm/keybindings]
switch-applications=['<Super>Tab']
switch-applications-backward=['<Shift><Super>Tab']
switch-to-workspace-left=['<Control><Super>Left']
switch-to-workspace-right=['<Control><Super>Right']
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Shift><Alt>Tab']

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false

# The Ubuntu dock (a Dash to Dock fork, so its settings live under that path).
[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=64
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
show-mounts=false
show-trash=false

# Desktop icons (Ubuntu's ding extension).
[org/gnome/shell/extensions/ding]
arrangeorder='NAME'
check-x11wayland=true
icon-size='large'
show-home=false
show-network-volumes=false
show-trash=false
show-volumes=false

[org/gnome/system/location]
enabled=false

[org/gtk/gtk4/settings/file-chooser]
sort-directories-first=true
